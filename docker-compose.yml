# =============================================================================
# Pets Store — прод-стек ЗА СОБСТВЕННЫМ Caddy на webdev-ai.com (80/443 + HTTPS)
# =============================================================================
# Это готовая версия /home/vera/pets-store/docker-compose.yml для случая,
# когда домен webdev-ai.com переключён с signal-app на pets-store.
#
# Отличия от исходного compose Веры:
#   1. web: вместо публикации порта наружу (ports: 8080:80) — только expose: 80
#      (наружу трафик отдаёт Caddy, а не nginx напрямую).
#   2. Добавлен сервис caddy: слушает 80/443, сам получает TLS-сертификат
#      Let's Encrypt для webdev-ai.com и проксирует всё в web:80
#      (nginx pets-store уже разруливает SPA + /api + /uploads + /docs).
#   3. Добавлены тома caddy-data / caddy-config (сертификаты переживают перезапуск).
#
# ВАЖНО: рядом с этим файлом должен лежать Caddyfile (см. инструкцию, Шаг 4).
# Порты 80/443 должны быть свободны — сначала гасится signal (инструкция, Шаг 1).
#
# Имя проекта зафиксировано => свои сеть/тома/имена контейнеров (pets-store-*),
# изолированные от других стеков на сервере.
name: pets-store

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${DB_NAME:-petstore}
    volumes:
      - db-data:/var/lib/postgresql
      # Дамп схемы+данных. Выполняется ТОЛЬКО при первой инициализации
      # пустого тома db-data. Чтобы перезалить дамп — снести том (см. DEPLOY.md).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-app} -d ${DB_NAME:-petstore}']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [petnet]

  api:
    build:
      context: ./api-swagger
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      DB_NAME: ${DB_NAME:-petstore}
      # Схемой управляют миграции (прогоняются при старте). НЕ включать auto-sync в проде.
      DB_SYNCHRONIZE: 'false'
      JWT_SECRET: ${JWT_SECRET:-change_me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      UPLOAD_DIR: /app/uploads
    volumes:
      # Загруженные файлы переживают пересборку. При первом старте том
      # наследует стартовые картинки, вшитые в образ (COPY uploads).
      - uploads:/app/uploads
    expose:
      - '3000'
    networks: [petnet]

  web:
    build:
      context: ./pets-store-web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    # Наружу порт больше НЕ публикуем — доступ идёт через сервис caddy ниже.
    expose:
      - '80'
    networks: [petnet]

  # Reverse-proxy + автоматический HTTPS для webdev-ai.com.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [petnet]

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:

networks:
  petnet:
